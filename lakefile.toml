name = "kr25ssmxt"
defaultTargets = ["Kr25Ssmxt"]

# Pinned so a fresh clone builds without a version hunt. If you bump the
# toolchain in lean-toolchain, bump both revs below to match.
#
# Run `lake exe cache get` after `lake update` — otherwise you compile
# Mathlib from source, which takes hours.

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Reusable, problem-independent material (finite probability, multiplicative
# error algebra, automata lower bounds, MDPs, …) lives here. Look for a lemma
# in arlib before proving it in this project.
[[require]]
name = "arlib"
git = "https://github.com/meelgroup/arlib.git"
rev = "8d08f89a6d05c5e8368e91659bd6e117fbb74c4e"

# CV18 and Hit-and-Run now live in the community algorithms repository.  Pin
# the audited head rather than tracking a moving branch.
[[require]]
name = "arlib-community"
git = "https://github.com/uddaloksarkar/arlib-community.git"
rev = "41a546726cc03bf02eaae77208e24aa23a4fb67a"

[[lean_lib]]
name = "Kr25Ssmxt"
